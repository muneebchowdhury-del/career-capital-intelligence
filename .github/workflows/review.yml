name: Resolve evidence review
on:
  workflow_dispatch:
    inputs:
      review_id:
        description: Review ID shown in data/reviews.json
        required: true
        type: string
      decision:
        description: Resolution
        required: true
        type: choice
        options: [validated, published, rejected, duplicate, superseded]
      note:
        description: Optional audit note
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: evidence-review
  cancel-in-progress: false
jobs:
  resolve-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/review.py "${{ inputs.review_id }}" "${{ inputs.decision }}" --note "${{ inputs.note }}"
      - run: |
          python scripts/build_site.py
          python scripts/build_standalone.py
      - run: python -m unittest discover -s tests -v
      - shell: bash
        run: |
          git config user.name "capital-intel-review-bot"
          git config user.email "capital-intel-review-bot@users.noreply.github.com"
          git add data docs
          git commit -m "review: ${{ inputs.decision }} ${{ inputs.review_id }}" || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
