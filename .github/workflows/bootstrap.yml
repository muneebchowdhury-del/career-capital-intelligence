name: Bootstrap Career Capital Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'project.tar.gz'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bootstrap-career-capital-intelligence
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unpack tested project
        run: |
          tar -xzf project.tar.gz
          rm -f project.tar.gz .github/workflows/bootstrap.yml

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Rebuild static dashboard
        run: python scripts/build_site.py

      - name: Commit bootstrapped project
        run: |
          git config user.name 'career-capital-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
          else
            git commit -m 'feat: deploy zero-cost career capital intelligence system'
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
