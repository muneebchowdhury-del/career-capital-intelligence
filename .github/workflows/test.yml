name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          python scripts/build_site.py
          python scripts/build_standalone.py
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/app-core.js
      - run: node --check docs/bootstrap.js
